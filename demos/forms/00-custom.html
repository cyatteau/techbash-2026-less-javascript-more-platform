<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Event Registration</title>
  
    <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f5f5f5;
}

main {
  width: min(90%, 500px);
  margin: 4rem auto;
  padding: 2rem;

  background: white;
  border-radius: 0.75rem;
}

form {
  display: grid;
  gap: 1.25rem;
}

label {
  display: grid;
  gap: 0.4rem;
}

input {
  padding: 0.65rem;
  font: inherit;
}

button {
  padding: 0.7rem 1rem;
  font: inherit;
  cursor: pointer;
}

.error {
  min-height: 1rem;
  font-size: 0.85rem;
  color: #b00020;
}

.focus-place {
  margin-left: 0.5rem;
  padding: 0.5rem 0.75rem;
  font: inherit;
  cursor: pointer;
}

#selected-place {
  padding: 1rem;
}

#back-button {
  margin-bottom: 1.5rem;
}

    </style>
  </head>

  <body>
    <main>
      <h1>Event Registration</h1>

      <form id="registration-form" novalidate>
        <label>
          Name
          <input id="name" name="name" type="text" />
          <span class="error" id="name-error"></span>
        </label>

        <label>
          Email
          <input id="email" name="email" type="text" />
          <span class="error" id="email-error"></span>
        </label>

        <label>
          Number of attendees
          <input id="attendees" name="attendees" type="number" />
          <span class="error" id="attendees-error"></span>
        </label>

        <button type="submit">Register</button>
      </form>

      <p id="success-message" hidden>Registration submitted!</p>
    </main>
  
    <script type="module">
const form = document.querySelector("#registration-form");

const nameInput = document.querySelector("#name");
const emailInput = document.querySelector("#email");
const attendeesInput = document.querySelector("#attendees");

const nameError = document.querySelector("#name-error");
const emailError = document.querySelector("#email-error");
const attendeesError = document.querySelector("#attendees-error");

const successMessage = document.querySelector("#success-message");

form.addEventListener("submit", (event) => {
  event.preventDefault();

  let isValid = true;

  nameError.textContent = "";
  emailError.textContent = "";
  attendeesError.textContent = "";
  successMessage.hidden = true;

  if (nameInput.value.trim() === "") {
    nameError.textContent = "Please enter your name.";
    isValid = false;
  }

  if (emailInput.value.trim() === "" || !emailInput.value.includes("@")) {
    emailError.textContent = "Please enter a valid email.";
    isValid = false;
  }

  const attendeeCount = Number(attendeesInput.value);

  if (!attendeesInput.value || attendeeCount < 1 || attendeeCount > 10) {
    attendeesError.textContent = "Choose between 1 and 10 attendees.";

    isValid = false;
  }

  if (!isValid) {
    return;
  }

  successMessage.hidden = false;
});

    </script>
  </body>
</html>
